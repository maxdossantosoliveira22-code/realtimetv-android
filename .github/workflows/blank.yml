      - name: Compilar o APK
        working-directory: proj
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
      - name: Resumo dos erros
        if: failure()
        run: |
          {
            echo '### Erros de compilacao (copie e envie ao Claude)'
            echo '```'
            grep -E '^e: |error:|What went wrong|FAILED' -A2 proj/build.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preparar arquivo
        run: |
          mkdir -p out
          cp proj/app/build/outputs/apk/release/app-release.apk out/RealtimeTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RealtimeTV-APK
          path: out/RealtimeTV.apk
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Realtime TV 1.0.${{ github.run_number }}
          files: out/RealtimeTV.apk
