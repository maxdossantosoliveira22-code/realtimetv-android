name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar o APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Resumo dos erros (se houver)
        if: failure()
        run: |
          {
            echo '### Erros de compilação (copie e envie ao Claude)'
            echo '```'
            grep -E '^e: |error:|What went wrong|FAILED' -A2 build.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar arquivo
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/RealtimeTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RealtimeTV-APK
          path: out/RealtimeTV.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Realtime TV 1.0.${{ github.run_number }}
          files: out/RealtimeTV.apk
